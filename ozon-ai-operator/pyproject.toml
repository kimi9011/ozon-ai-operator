[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-ai-operator"
version = "0.1.0"
description = "Closed-loop Ozon product selection and operations engine"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "requests>=2.32",
  "pydantic>=2.8",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "streamlit>=1.37",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
]

[project.scripts]
ozon-ai = "ozon_ai_operator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
